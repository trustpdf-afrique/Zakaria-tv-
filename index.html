<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZTV Moyenne</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090D1A;
      --bg-card: #1B2133;
      --bg-input: #111827;
      --border-light: #2A344A;

      --orange-ztv: #FF8C00;
      --green-ztv: #09A63D;
      --white: #FFFFFF;
      --text-gray: #9CA3AF;

      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 9999px;

      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
      --glow-orange: 0 0 20px rgba(255, 140, 0, 0.4);
      --glow-green: 0 0 20px rgba(9, 166, 61, 0.4);

      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #03060D;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--white);
    }

    /* CHÂSSIS APPLICATION MOBILE */
    .app-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 920px;
      background-color: var(--bg-main);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0,0,0,0.95);
      border-radius: 0px;
    }

    .app-frame::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, 
        rgba(255, 140, 0, 0.05) 0%, 
        rgba(255, 255, 255, 0.02) 50%, 
        rgba(9, 166, 61, 0.05) 100%);
      pointer-events: none;
      z-index: 0;
    }

    @media (min-width: 450px) {
      .app-frame {
        border-radius: 36px;
        height: 94vh;
        border: 2px solid var(--border-light);
      }
    }

    /* TRANSITIONS & PAGES */
    .page-view {
      display: none;
      flex-direction: column;
      width: 100%;
      min-height: 100%;
      padding-bottom: 40px;
      z-index: 1;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .page-view.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LOGO & BRANDING */
    .ztv-logo-brand {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    /* EN-TÊTE AUTHENTIFICATION */
    .auth-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 13, 26, 0.8);
    }

    .btn-creator-top {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--white);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-creator-top:active { transform: scale(0.96); }

    .header-divider-line {
      width: 100%;
      height: 2px;
      background: var(--orange-ztv);
      box-shadow: var(--glow-orange);
    }

    /* CARTE DE PRÉSENTATION */
    .presentation-card {
      margin: 16px 20px;
      background: linear-gradient(135deg, rgba(9, 166, 61, 0.35) 0%, rgba(255, 140, 0, 0.35) 100%), var(--bg-card);
      border: 1.5px solid var(--orange-ztv);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-card);
    }

    .presentation-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .presentation-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: -0.3px;
    }

    .presentation-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #E2E8F0;
      margin-top: 5px;
      line-height: 1.35;
    }

    /* CARTE DE CONNEXION / INSCRIPTION */
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      margin: 0 20px;
      padding: 20px;
      box-shadow: var(--shadow-card);
    }

    /* ONGLETS (TABS) */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
      background: var(--bg-input);
      padding: 5px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
    }

    .tab-btn {
      padding: 12px;
      border-radius: var(--radius-pill);
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      color: var(--white);
      background: transparent;
    }

    .tab-btn.active {
      background: var(--orange-ztv);
      color: #000;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--glow-orange);
    }

    /* FORMULAIRES */
    .form-grid-dual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group { margin-bottom: 14px; }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: var(--transition);
    }

    .form-input::placeholder { color: var(--text-gray); font-weight: 500; }
    .form-input:focus { border-color: var(--orange-ztv); box-shadow: 0 0 12px rgba(255, 140, 0, 0.25); }
    select.form-input { appearance: none; cursor: pointer; }

    /* ERROR MESSAGE FORM */
    .auth-error-msg {
      color: #EF4444;
      font-size: 11px;
      font-weight: 700;
      margin-top: 10px;
      text-align: center;
      display: none;
      line-height: 1.3;
    }

    /* BOUTON SELECTION PHOTO GALERIE */
    .btn-photo-gallery {
      width: 100%;
      background: linear-gradient(135deg, #1F293D 0%, #111827 100%);
      border: 1.5px dashed var(--orange-ztv);
      color: #FFF;
      padding: 14px;
      border-radius: var(--radius-lg);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      text-align: center;
    }
    .btn-photo-gallery:hover { background: rgba(255, 140, 0, 0.1); }

    /* BOUTON PRINCIPAL VERT */
    .btn-main-green {
      background: var(--green-ztv);
      color: var(--white);
      font-weight: 800;
      font-size: 15px;
      border: none;
      border-radius: var(--radius-pill);
      padding: 16px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--glow-green);
      transition: var(--transition);
      margin-top: 10px;
    }
    .btn-main-green:active { transform: scale(0.97); }

    .forgot-link {
      display: block; text-align: center; color: var(--text-gray);
      font-size: 12px; font-weight: 600; margin-top: 16px;
      text-decoration: none; transition: var(--transition);
    }
    .forgot-link:hover { color: var(--white); }

    /* BOUTON FLOTTANT WHATSAPP */
    .whatsapp-float-btn {
      position: fixed; bottom: 24px; right: 24px;
      width: 56px; height: 56px; background: #25D366;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
      z-index: 1000; cursor: pointer; transition: var(--transition); text-decoration: none;
    }
    .whatsapp-float-btn:active { transform: scale(0.9); }

    /* ================= DASHBOARD STYLES ================= */
    .dash-header {
      padding: 20px; display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(27, 33, 51, 0.8) 0%, rgba(9, 13, 26, 0) 100%);
    }
    .user-profile-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar-circle {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid var(--orange-ztv); object-fit: cover; background: var(--bg-card);
    }

    /* SECTION DES 3 TRIMESTRES */
    .trimestres-section { padding: 0 16px; margin-bottom: 16px; }
    .trimestres-row-top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .trimestres-row-bottom { display: flex; justify-content: center; }
    .trimestres-row-bottom .trim-card { width: 100%; max-width: 220px; }

    .trim-card {
      border-radius: var(--radius-xl); padding: 16px; color: #FFF;
      cursor: pointer; box-shadow: var(--shadow-card); transition: var(--transition);
      position: relative; overflow: hidden;
    }
    .trim-card:active { transform: scale(0.97); }
    .trim-card-1 { 
      background: linear-gradient(135deg, #FF8C00, #D96B00); 
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
    }
    .trim-card-2 { 
      background: #FFFDF9; 
      color: #0F172A; 
      border: 1.5px solid #E2E8F0;
    }
    .trim-card-3 { 
      background: linear-gradient(135deg, #09A63D, #00803E); 
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 15px rgba(9, 166, 61, 0.3);
    }

    .trim-header-flex { display: flex; justify-content: space-between; align-items: center; }
    .trim-title-box { display: flex; align-items: center; gap: 6px; }
    .trim-title { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
    .trim-sublbl { font-size: 10px; font-weight: 700; opacity: 0.85; margin-top: 4px; }
    .trim-val { font-size: 19px; font-weight: 900; margin-top: 4px; }
    .trim-arrow-circle {
      width: 26px; height: 26px; border-radius: 50%;
      background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center; 
      font-size: 12px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .trim-card-2 .trim-arrow-circle { background: #0F172A; color: #FFF; }

    .annual-card-ztv {
      background: #FFFFFF; border-radius: var(--radius-xl);
      padding: 18px; margin: 0 16px 16px; color: #0F172A; box-shadow: var(--shadow-card);
    }
    .annual-top-title {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: var(--green-ztv); font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 14px;
    }
    .annual-stats-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      text-align: center; border-top: 1px solid #E2E8F0; padding-top: 12px;
    }
    .annual-stat-lbl { font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; }
    .annual-stat-val { font-size: 18px; font-weight: 900; margin-top: 4px; color: #0F172A; }

    .progression-card-ztv {
      background: #FFFFFF; border-radius: var(--radius-xl); padding: 16px 20px;
      margin: 0 16px 16px; color: #0F172A; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-card);
    }
    .prog-circle {
      width: 56px; height: 56px; border-radius: 50%; border: 5px solid #EF4444;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #0F172A; flex-shrink: 0;
      transition: var(--transition);
    }
    .prog-bar-bg { width: 100%; height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .prog-bar-fill { height: 100%; width: 0%; background: #EF4444; border-radius: 4px; transition: all 0.5s ease; }

    .objective-banner {
      background: linear-gradient(135deg, #FF8C00, #D95300);
      border-radius: var(--radius-lg); padding: 14px 18px; margin: 0 16px 16px; color: #FFF;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: var(--transition);
    }
    .objective-banner:active { transform: scale(0.98); }

    /* BOUTON ORIENTATION 3EME */
    .orientation-card-3eme {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
      border: 1.5px solid #818CF8;
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      margin: 0 16px 16px;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(49, 46, 129, 0.4);
      transition: var(--transition);
    }
    .orientation-card-3eme:active { transform: scale(0.97); }

    /* BOUTONS PASTILLES PREMIUM DU BAS (PROFIL PUIS TABLEAU D'HONNEUR) */
    .bottom-dual-btns { display: flex; flex-direction: column; gap: 12px; padding: 0 16px; margin-bottom: 20px; }
    
    .btn-pill-premium {
      background: linear-gradient(135deg, #241A08 0%, #171105 100%);
      border: 1.5px solid #F59E0B;
      border-radius: var(--radius-xl);
      padding: 16px 18px;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
      transition: var(--transition);
      width: 100%;
    }
    .btn-pill-premium:active { transform: scale(0.98); }
    
    .btn-pill-premium-green {
      background: linear-gradient(135deg, #092613 0%, #05170B 100%);
      border-color: #10B981;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }

    .pill-icon-circle {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(245, 158, 11, 0.2); display: flex;
      align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .btn-pill-premium-green .pill-icon-circle { background: rgba(16, 185, 129, 0.2); }

    /* BULLETIN DE NOTES */
    .bulletin-container { padding: 16px; background: var(--bg-main); min-height: 100%; }
    .bulletin-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .btn-back-link {
      background: var(--bg-card); border: 1px solid var(--border-light);
      color: #FFF; padding: 10px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    .bulletin-table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      background: var(--bg-card); border-radius: var(--radius-lg);
      overflow: hidden; border: 1px solid var(--border-light); margin-bottom: 20px;
    }
    .bulletin-table th {
      background: #111827; color: var(--orange-ztv); padding: 12px 8px;
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      border-bottom: 1px solid var(--border-light); text-align: center;
    }
    .bulletin-table th:first-child { text-align: left; padding-left: 12px; }
    .bulletin-table td { padding: 10px 8px; font-size: 12px; border-bottom: 1px solid #222C40; text-align: center; color: #FFF; }
    .bulletin-table td:first-child { text-align: left; padding-left: 12px; font-weight: 600; }
    
    .section-title-row td {
      background: #0D1322; color: var(--green-ztv); font-weight: 800;
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px; text-align: center !important; padding: 8px !important;
    }

    .inp-coef {
      width: 42px; background: var(--bg-input); border: 1px solid var(--border-light);
      color: #FFF; text-align: center; border-radius: 6px; padding: 6px; font-weight: 700; font-size: 12px;
    }

    .inp-note {
      width: 58px; background: var(--bg-input); border: 1.5px solid var(--orange-ztv);
      color: #FFF; text-align: center; border-radius: 8px; padding: 6px; font-weight: 800; font-size: 13px;
    }

    .summary-row td { background: #111827; font-weight: 800; color: var(--orange-ztv); font-size: 13px; border-top: 2px solid var(--border-light); }

    /* MON PROFIL */
    .profile-card-box {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius-xl); padding: 24px 20px; margin: 16px;
      box-shadow: var(--shadow-card); text-align: center;
    }
    .profile-avatar-large {
      width: 95px; height: 95px; border-radius: 50%;
      border: 3px solid var(--green-ztv); object-fit: cover;
      margin-bottom: 12px; background: var(--bg-input); box-shadow: var(--glow-green);
    }
    .profile-field-list { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .profile-field-item {
      background: #111827; border: 1px solid var(--border-light);
      border-radius: var(--radius-md); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .profile-field-label { font-size: 11px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; }
    .profile-field-value { font-size: 13px; color: #FFF; font-weight: 800; }

    /* ================= TABLEAU D'HONNEUR - DESIGN DIPLÔME VERTICAL PORTRAIT ================= */
    .certif-selector-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 16px;
      scrollbar-width: none;
    }
    .certif-selector-bar::-webkit-scrollbar { display: none; }
    .certif-tab-btn {
      background: var(--bg-card); border: 1px solid var(--border-light);
      color: var(--white); padding: 10px 16px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 800; whitespace: nowrap; cursor: pointer; transition: var(--transition);
    }
    .certif-tab-btn.active {
      background: var(--orange-ztv); color: #000; border-color: #FFF; box-shadow: var(--glow-orange);
    }

    .portrait-cert-wrapper {
      padding: 0 16px;
      width: 100%;
    }

    /* BORDURE LUXUEUSE OFFICIELLE DIPLÔME VERTICAL PORTRAIT */
    .certificate-portrait-frame {
      background: #FFFDF8;
      border: 8px double #92400E;
      outline: 2px solid #D97706;
      outline-offset: -5px;
      border-radius: 16px;
      padding: 24px 18px;
      color: #1E293B;
      text-align: center;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      width: 100%;
      box-sizing: border-box;
      margin: 0 auto;
      background-image: radial-gradient(#F59E0B 0.5px, transparent 0.5px);
      background-size: 16px 16px;
    }

    .cert-inner-border {
      border: 1px solid rgba(180, 83, 9, 0.3);
      padding: 18px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
    }

    .cert-header-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #D97706;
      padding-bottom: 12px;
      margin-bottom: 16px;
      gap: 6px;
    }

    .cert-header-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .cert-title-portrait {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 900;
      color: #78350F;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cert-subtitle-gold {
      font-size: 11px;
      color: #09A63D;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .cert-body-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 14px 0;
      gap: 10px;
